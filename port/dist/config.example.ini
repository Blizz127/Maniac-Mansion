# Maniac Mansion (NES) port configuration (example). Copy to
# ~/.config/maniac-mansion-port/config.ini, or pass --config FILE.
# Precedence: --set section.key=value > MM_<SECTION>_<KEY> environment
# variables (e.g. MM_VIDEO_SCALE=4) > this file. Defaults are the original
# game on an NTSC console; nothing here is an enhancement unless it says so.

[game]
# rom = /path/to/Maniac Mansion (USA).nes   # also $MM_ROM or launch.sh arg 1

[video]
scale = 3              # initial window size (integer multiple)
aspect = 8:7           # 8:7 (NTSC TV pixel shape) or square
overscan_crop = 0      # lines hidden at top and bottom (0..16); TVs hid ~8
fullscreen = off       # Alt+Enter toggles
vsync = on

[audio]
enabled = on
volume = 100           # 0..100
rate = 48000

[input]                # SDL key names
a = X
b = Z
select = Right Shift
start = Return
up = Up
down = Down
left = Left
right = Right

[dev]
dev_menu = off         # on: enables the dev menu (F8 / Back+Start); also MM_DEV_MENU=1
                       # MM_CHEATS=0 disables it even when requested
